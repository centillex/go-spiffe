name: PR Build
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  lint-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - name: Verify Go baseline
        shell: bash
        run: test "$(go env GOVERSION)" = "go1.27.3"
      - name: Lint
        run: make lint

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - name: Verify Go baseline
        shell: bash
        run: test "$(go env GOVERSION)" = "go1.27.3"
      - name: Verify Linux baseline
        run: bash scripts/verify-go-baseline.sh .build/baseline
      - name: Setup Node for independent bundle interoperability
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
      - name: Verify independent bundle encoding
        run: bash scripts/pqbundle-interop/run.sh .build/pqbundle-interop
      - name: Upload independent bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pqbundle-format-interop
          path: .build/pqbundle-interop
          if-no-files-found: error
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-go-baseline
          path: .build/baseline
          if-no-files-found: error

  lint-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - name: Verify Go baseline
        shell: bash
        run: test "$(go env GOVERSION)" = "go1.27.3"
      - name: Install msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel 
            mingw-w64-x86_64-toolchain 
            unzip 
      - name: Lint
        run: make lint

  test-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - name: Verify Go baseline
        shell: bash
        run: test "$(go env GOVERSION)" = "go1.27.3"
      - name: Install msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel 
            mingw-w64-x86_64-toolchain 
            unzip 
      - name: Test
        run: make test

  # This job is just here to make sure that the other jobs have completed
  # and is used as a single job to block PR merge from. GH doesn't have a
  # way to say "all jobs from this action", which would be ideal.
  success:
    needs: [lint-linux, test-linux, lint-windows, test-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Shout it out
        run: echo SUCCESS

